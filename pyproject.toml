[project]
name = "smart-loader"
version = "0.1.6"
description = "Tiered data loader for Docta services — Redis Tier 1 + S3 Parquet Tier 2"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
pg = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.20",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[tool.pytest.ini_options]
markers = [
    "pg: requires a real dwh Postgres instance (SMART_LOADER_TEST_PG_DSN)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smart_loader*"]
